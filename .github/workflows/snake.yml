name: Generate contribution snake

on: # yamllint disable-line rule:truthy
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: generate-contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake animation from contribution grid
        id: generate
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Prefer a user PAT (repo scope) so private-repo contributions are visible
          # when "Include private contributions on my profile" is enabled.
          # Falls back to the workflow token (public calendar only).
          github_token: ${{ secrets.SNAKE_TOKEN || github.token }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#8B5CF6&color_dots=#0B0B0F,#2E1065,#5B21B6,#8B5CF6,#C4B5FD

      - name: Validate generated SVGs
        env:
          GH_TOKEN: ${{ secrets.SNAKE_TOKEN || github.token }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          light="dist/github-contribution-grid-snake.svg"
          dark="dist/github-contribution-grid-snake-dark.svg"

          for f in "$light" "$dark"; do
            if [[ ! -s "$f" ]]; then
              echo "::error::Missing or empty SVG: $f"
              exit 1
            fi

            size="$(wc -c < "$f" | tr -d ' ')"
            if [[ "$size" -lt 2000 ]]; then
              echo "::error::SVG suspiciously small (${size} bytes): $f"
              exit 1
            fi

            if ! grep -q '<svg' "$f"; then
              echo "::error::Invalid SVG markup (no <svg>): $f"
              exit 1
            fi

            cells="$(grep -oE 'class="c c[0-9a-f]+"' "$f" | wc -l | tr -d ' ')"
            echo "Validated $f (${size} bytes, ${cells} contribution cells)"

            if [[ "$cells" -lt 1 ]]; then
              echo "::error::SVG has no contribution cells: $f"
              exit 1
            fi
          done

          light_cells="$(grep -oE 'class="c c[0-9a-f]+"' "$light" | wc -l | tr -d ' ')"
          dark_cells="$(grep -oE 'class="c c[0-9a-f]+"' "$dark" | wc -l | tr -d ' ')"
          if [[ "$light_cells" -ne "$dark_cells" ]]; then
            echo "::error::Light/dark contribution cell mismatch: ${light_cells} vs ${dark_cells}"
            exit 1
          fi

          # Cross-check against the same contribution calendar the action should mirror.
          api_cells="$(
            curl -sS \
              -H "Authorization: bearer ${GH_TOKEN}" \
              -H "Content-Type: application/json" \
              -H "User-Agent: 1berto-o-snake-validator" \
              --data "{\"query\":\"query(\$login:String!){user(login:\$login){contributionsCollection{contributionCalendar{weeks{contributionDays{contributionCount}}}}}}\",\"variables\":{\"login\":\"${USERNAME}\"}}" \
              https://api.github.com/graphql \
            | jq '[.data.user.contributionsCollection.contributionCalendar.weeks[].contributionDays[] | select(.contributionCount > 0)] | length'
          )"

          echo "GraphQL contribution days: ${api_cells}"
          echo "SVG contribution cells: ${light_cells}"

          if [[ -z "$api_cells" || "$api_cells" == "null" ]]; then
            echo "::error::Failed to query contribution calendar for validation"
            exit 1
          fi

          if [[ "$light_cells" -lt "$api_cells" ]]; then
            echo "::error::Generated SVG is outdated/incomplete versus GitHub calendar (${light_cells} < ${api_cells})"
            exit 1
          fi

          if [[ "$light_cells" -gt "$api_cells" ]]; then
            echo "::warning::SVG has more cells than GraphQL calendar (${light_cells} > ${api_cells}); publishing anyway"
          fi

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
