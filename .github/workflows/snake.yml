# Contribution snake — official Platane/snk (no custom SVG post-processing)
name: Generate contribution snake

on: # yamllint disable-line rule:truthy
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake animation from contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Prefer SNAKE_TOKEN so the calendar matches the signed-in profile.
          github_token: ${{ secrets.SNAKE_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7C3AED&color_dots=#EBEDF0,#DDD6FE,#A78BFA,#7C3AED,#5B21B6
            dist/github-contribution-grid-snake-dark.svg?color_snake=#8B5CF6&color_dots=#0B0B0F,#5B21B6,#7C3AED,#A78BFA,#EDE9FE

      - name: Ensure SVGs were generated
        run: |
          set -euo pipefail
          light="dist/github-contribution-grid-snake.svg"
          dark="dist/github-contribution-grid-snake-dark.svg"

          for f in "$light" "$dark"; do
            if [[ ! -s "$f" ]]; then
              echo "::error::Missing or empty SVG: $f"
              exit 1
            fi
            if ! grep -q "Generated with https://github.com/Platane/snk" "$f"; then
              echo "::error::SVG is not a Platane/snk output: $f"
              exit 1
            fi
            if ! grep -qE '@keyframes s[0-9a-f]+\{' "$f"; then
              echo "::error::Snake movement keyframes missing: $f"
              exit 1
            fi
            if ! grep -qE '@keyframes c[0-9a-f]+\{' "$f"; then
              echo "::error::Cell-eat keyframes missing (original animation required): $f"
              exit 1
            fi
          done

          echo "Platane/snk SVGs OK:"
          ls -la "$light" "$dark"

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
