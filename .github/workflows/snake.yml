name: Generate contribution snake

on: # yamllint disable-line rule:truthy
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation from contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Prefer SNAKE_TOKEN (user PAT/OAuth with repo scope) so the calendar
          # matches the profile. Default GITHUB_TOKEN can yield inconsistent grids.
          github_token: ${{ secrets.SNAKE_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7C3AED&color_dots=#EBEDF0,#DDD6FE,#A78BFA,#7C3AED,#5B21B6
            dist/github-contribution-grid-snake-dark.svg?color_snake=#8B5CF6&color_dots=#0B0B0F,#5B21B6,#7C3AED,#A78BFA,#EDE9FE

      - name: Compose static calendar base + original snake animation
        run: node .github/scripts/postprocess-snake-svg.mjs dist

      - name: Validate generated SVGs
        env:
          GH_TOKEN: ${{ secrets.SNAKE_TOKEN || secrets.GITHUB_TOKEN }}
          EXPECTED_USER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          light="dist/github-contribution-grid-snake.svg"
          dark="dist/github-contribution-grid-snake-dark.svg"

          for f in "$light" "$dark"; do
            if [[ ! -s "$f" ]]; then
              echo "::error::Missing or empty SVG: $f"
              exit 1
            fi
            size=$(wc -c < "$f")
            if (( size < 5000 )); then
              echo "::error::SVG too small (${size} bytes), likely invalid: $f"
              exit 1
            fi
            if ! grep -q "Generated with https://github.com/Platane/snk" "$f"; then
              echo "::error::SVG missing Platane/snk marker: $f"
              exit 1
            fi
            if ! grep -q '<rect class="c' "$f"; then
              echo "::error::SVG missing contribution grid rects: $f"
              exit 1
            fi

            # Dual-layer contract
            if ! grep -q 'id="calendar-base"' "$f"; then
              echo "::error::Missing static calendar-base layer: $f"
              exit 1
            fi
            if ! grep -qE '@keyframes c[0-9a-f]+\{' "$f"; then
              echo "::error::Missing original eat keyframes c*: $f"
              exit 1
            fi
            if ! grep -qE '@keyframes s[0-9a-f]+\{' "$f"; then
              echo "::error::Missing snake keyframes s*: $f"
              exit 1
            fi
            if ! grep -qE 'animation-name: *c[0-9a-f]+' "$f"; then
              echo "::error::Animated contribution cells lost animation-name: $f"
              exit 1
            fi
            if grep -qE '\.c\.c[0-9a-f]+\{fill:var\(--c[1-4]\);animation:none\}' "$f"; then
              echo "::error::Animated layer incorrectly frozen with animation:none: $f"
              exit 1
            fi
            if grep -qE '@keyframes c[0-9a-f]+\{.*fill:var\(--ce\)' "$f"; then
              echo "::error::Eat keyframes still paint opaque --ce over the base: $f"
              exit 1
            fi
            if ! grep -q 'fill:transparent' "$f"; then
              echo "::error::Eat keyframes missing transparent reveal: $f"
              exit 1
            fi

            base_count=$(grep -oE '<rect class="cb c[0-9a-f]+"' "$f" | wc -l)
            anim_count=$(grep -oE '<rect class="c c[0-9a-f]+"' "$f" | wc -l)
            if [[ "$base_count" -le 0 || "$base_count" -ne "$anim_count" ]]; then
              echo "::error::Base/animated cell mismatch in $f ($base_count vs $anim_count)"
              exit 1
            fi
          done

          # Contrast + brand palette checks (dark)
          if ! grep -q '#8B5CF6' "$dark"; then
            echo "::error::Dark SVG lost purple snake color (#8B5CF6)"
            exit 1
          fi
          if ! grep -q '#5B21B6' "$dark"; then
            echo "::error::Dark SVG missing improved level-1 purple (#5B21B6)"
            exit 1
          fi
          if grep -q '#2E1065' "$dark"; then
            echo "::error::Dark SVG still uses low-contrast #2E1065"
            exit 1
          fi

          echo "GraphQL contribution days (source of truth):"
          gh api graphql -f query='
            query($login:String!) {
              user(login:$login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        date
                        contributionCount
                      }
                    }
                  }
                }
              }
            }' -f login="$EXPECTED_USER" \
            --jq '
              .data.user.contributionsCollection.contributionCalendar as $c
              | "total=\($c.totalContributions)",
                ([$c.weeks[].contributionDays[] | select(.contributionCount > 0) | .date] | sort | .[])
            '

          api_count=$(
            gh api graphql -f query='
              query($login:String!) {
                user(login:$login) {
                  contributionsCollection {
                    contributionCalendar {
                      weeks {
                        contributionDays {
                          contributionCount
                        }
                      }
                    }
                  }
                }
              }' -f login="$EXPECTED_USER" \
              --jq '[.data.user.contributionsCollection.contributionCalendar.weeks[].contributionDays[] | select(.contributionCount > 0)] | length'
          )

          svg_count=$(grep -oE '<rect class="cb c[0-9a-f]+"' "$dark" | wc -l)

          echo "GraphQL contribution days: $api_count"
          echo "SVG base-layer contribution cells: $svg_count"

          if [[ -z "$api_count" || "$api_count" -le 0 ]]; then
            echo "::error::GraphQL returned no contribution days — refusing to publish"
            exit 1
          fi

          if [[ "$svg_count" -ne "$api_count" ]]; then
            echo "::error::SVG cell count ($svg_count) does not match GraphQL contribution days ($api_count)"
            echo "::error::Refusing to publish a stale or inconsistent snake"
            exit 1
          fi

          echo "SVG validation passed (static base + original eat/snake animation)"

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
